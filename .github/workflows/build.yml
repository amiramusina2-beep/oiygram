name: Build Oiygram APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android/sdk
      ANDROID_SDK_ROOT: /home/runner/android/sdk

    steps:
    - name: Clone Telegram Source Code
      run: |
        git clone --depth 1 https://github.com/DrKLO/Telegram.git .

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK manually
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip
        unzip -q sdk.zip -d $ANDROID_HOME/cmdline-tools/
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf $ANDROID_HOME/cmdline-tools/cmdline-tools/ sdk.zip
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK (Release)
      run: ./gradlew :TMessagesProj:assembleAfatRelease

    - name: Upload generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Oiygram-Release
        path: TMessagesProj/build/outputs/apk/afat/release/*.apk
