name: Build Oiygram APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clone Telegram Repo
      run: |
        rm -rf ./*
        git clone --depth 1 https://github.com/DrKLO/Telegram.git .

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Telegram APK
      run: ./gradlew assembleAfatRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Oiygram-Release
        path: TMessagesProj/build/outputs/apk/afat/release/*.apk
